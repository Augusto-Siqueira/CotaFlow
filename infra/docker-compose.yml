# CotaFlow — pilha própria (equivalente ao Supabase) para o ENSAIO local e
# como modelo dos serviços no Railway. O site (supabase-js) continua falando
# com UM endereço (o gateway), exatamente como falava com o Supabase:
#   /rest/v1  -> PostgREST   (API das tabelas, com RLS)
#   /auth/v1  -> GoTrue      (login, usuários, senhas)
#   /storage/v1 -> Storage   (fotos do app do motorista)
#
# Uso (a partir da pasta infra):
#   node scripts/gen-keys.mjs      # cria o .env com senhas e chaves novas
#   docker compose up -d
#   docker compose ps
name: cotaflow-infra

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    ports:
      - "${DB_PORT:-54329}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.174.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_API_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      # Só a equipe cria usuários (painel/SQL): ninguém se cadastra sozinho.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Sem e-mail de confirmação: os usuários são criados já confirmados.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: nao-responder@cotaflow.local
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 2500
      # Anti-robô (Cloudflare Turnstile): ligar só em produção.
      GOTRUE_SECURITY_CAPTCHA_ENABLED: ${CAPTCHA_ENABLED}
      GOTRUE_SECURITY_CAPTCHA_PROVIDER: turnstile
      GOTRUE_SECURITY_CAPTCHA_SECRET: ${CAPTCHA_SECRET}
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 6

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      # Evita o limite padrão de 1000 linhas virar surpresa: o site já pagina.
      PGRST_DB_MAX_ROWS: 1000
      # Economia de memória (em servidor com muitos núcleos o PostgREST reserva
      # memória por núcleo): 2 núcleos, coleta de lixo enxuta e 5 conexões.
      GHCRTS: "-N2 -A2m -qg -I0.3"
      PGRST_DB_POOL: 5

  storage:
    image: supabase/storage-api:v1.24.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 10485760
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: cotaflow
      REGION: local
      GLOBAL_S3_BUCKET: cotaflow
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    ports:
      - "${GATEWAY_PORT:-54321}:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  db-data:
  storage-data:
